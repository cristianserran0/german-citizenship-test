<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Einbürgerungstest — Staatsbürgerkunde</title>
<meta name="description" content="Alle 300 allgemeinen und 160 landesbezogenen Fragen des BAMF-Gesamtfragenkatalogs — offline nutzbar.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f4f1e8">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Einbürgerungstest">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1a1a1a;--paper:#f4f1e8;--paper-2:#eae5d6;
  --gold:#c8a94e;--gold-deep:#9a7d2e;
  --red:#b5231f;--charcoal:#2b2b2b;
  --line:rgba(26,26,26,.14);--line-strong:rgba(26,26,26,.28);
  --muted:#6b6456;--muted-2:#8a8375;
  --green:#2f6b3f;--green-bg:rgba(47,107,63,.1);
  --red-bg:rgba(181,35,31,.08);
  --surface:#fff;--surface-2:rgba(255,255,255,.5);
}
/* Dark mode: same paper-and-ink feel, inverted. Follows the OS setting. */
@media (prefers-color-scheme:dark){
  :root{
    --ink:#ece7db;--paper:#15150f;--paper-2:#23231c;
    --gold:#d2b45e;--gold-deep:#cfae55;
    --red:#e2615a;--charcoal:#cfc9ba;
    --line:rgba(236,231,219,.16);--line-strong:rgba(236,231,219,.32);
    --muted:#a39b86;--muted-2:#837c6c;
    --green:#6bbd82;--green-bg:rgba(107,189,130,.14);
    --red-bg:rgba(226,97,90,.15);
    --surface:#1d1d16;--surface-2:rgba(236,231,219,.05);
  }
  .q-img,.opt-img img{background:#fff;padding:.35rem;border-radius:2px}
  .mode-btn:hover{box-shadow:0 4px 14px rgba(0,0,0,.4)}
  .acct-panel{box-shadow:0 6px 20px rgba(0,0,0,.5)}
}
body{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;background:var(--paper);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
.bg-seal{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.035;background-image:radial-gradient(circle at 50% 42%,var(--ink) 0 1px,transparent 1px);background-size:22px 22px}
.wrap{max-width:640px;margin:0 auto;padding:1.75rem 1.25rem 4rem;position:relative;z-index:1}

/* Header */
.header{text-align:center;margin-bottom:1.75rem;padding-bottom:1.25rem;border-bottom:1px solid var(--line)}
.flag{display:flex;justify-content:center;gap:0;margin:0 auto .9rem;width:64px;height:8px;border-radius:1px;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.15)}
.flag i{flex:1}.flag .k{background:#111}.flag .r{background:var(--red)}.flag .g{background:var(--gold)}
.eyebrow{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.62rem;font-weight:600;letter-spacing:.32em;color:var(--muted);text-transform:uppercase;margin-bottom:.6rem}
h1{font-size:clamp(1.7rem,5vw,2.3rem);font-weight:600;color:var(--ink);letter-spacing:-.01em;line-height:1.05}
.sub{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.68rem;letter-spacing:.18em;color:var(--muted-2);text-transform:uppercase;margin-top:.5rem}

/* Compact header — quiz & result screens */
.header.compact{margin-bottom:1.1rem;padding-bottom:.75rem}
.header.compact .flag{width:44px;height:6px;margin-bottom:.55rem}
.header.compact .eyebrow,.header.compact .sub{display:none}
.header.compact h1{font-size:1.1rem;letter-spacing:.02em}

/* Bundesland picker */
.land-row{display:flex;align-items:center;justify-content:space-between;gap:.75rem;background:var(--surface-2);border:1px solid var(--line);border-radius:3px;padding:.7rem .85rem;margin-bottom:.6rem}
.land-lbl{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.62rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);flex-shrink:0}
.land-sel{flex:1;min-width:0;max-width:62%;border:1px solid var(--line-strong);border-radius:3px;background:var(--surface);color:var(--ink);font-family:"Helvetica Neue",Arial,sans-serif;font-size:.82rem;padding:.4rem .5rem}
.land-sel:focus{outline:none;border-color:var(--ink)}
.land-hint{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.72rem;line-height:1.5;color:var(--muted-2);margin:0 .1rem 1.25rem}
.mode-btn.land{border-color:var(--gold-deep)}
.mode-btn.land .idx{background:var(--gold-deep);font-size:.6rem;letter-spacing:.02em}

.credit{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.62rem;line-height:1.5;color:var(--muted-2);text-align:center;margin-top:2rem;padding-top:1rem;border-top:1px solid var(--line)}
.q-img{display:block;max-width:100%;max-height:230px;margin:.9rem auto 0;border:1px solid var(--line);border-radius:3px}

/* Image answers (Wappen / Bundesland-Karte) */
.opts-img{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}
.opts-img .opt{margin-bottom:0;flex-direction:column;align-items:center;gap:.5rem;padding:.9rem .7rem}
.opt-img{display:flex;align-items:center;justify-content:center;width:100%;height:110px}
.opt-img img{max-height:110px;max-width:100%;object-fit:contain}
.missed-img{display:block;max-height:80px;margin-top:.45rem}

/* Quiz top bar: exit + language toggle */
.qtop{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.1rem}
.qtop .lang-row{margin-bottom:0}
.exit-btn{background:none;border:none;font-family:"Helvetica Neue",Arial,sans-serif;font-size:.62rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2);cursor:pointer;padding:.25rem 0;transition:color .16s}
.exit-btn:hover{color:var(--red)}

/* Language toggle */
.lang-row{display:flex;align-items:center;gap:.4rem;justify-content:flex-end;margin-bottom:1.1rem;opacity:.7;transition:opacity .16s}
.lang-row:hover{opacity:1}
.lang-row span{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.58rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.tog-wrap{position:relative;width:32px;height:18px;cursor:pointer;display:inline-block}
.tog-wrap input{opacity:0;width:0;height:0;position:absolute}
.tog-track{position:absolute;inset:0;background:var(--paper-2);border-radius:9px;border:1px solid var(--line-strong);transition:all .2s}
.tog-thumb{position:absolute;top:3px;left:3px;width:12px;height:12px;background:var(--muted);border-radius:50%;transition:all .2s}
.tog-wrap input:checked~.tog-track{background:var(--gold);border-color:var(--gold-deep)}
.tog-wrap input:checked~.tog-thumb{left:17px;background:var(--paper)}

/* Intro card */
.intro{background:var(--surface-2);border:1px solid var(--line);border-radius:3px;padding:1.4rem 1.5rem;margin-bottom:1.5rem}
.intro p{font-size:.96rem;line-height:1.65;color:var(--charcoal)}
.intro .lead{font-size:.72rem;font-family:"Helvetica Neue",Arial,sans-serif;letter-spacing:.03em;color:var(--muted);margin-top:.85rem;display:flex;gap:1.25rem;flex-wrap:wrap}
.intro .lead b{color:var(--ink);font-weight:600}

/* Mode buttons */
.modes{display:flex;flex-direction:column;gap:.7rem;margin-bottom:2.25rem}
.mode-btn{width:100%;padding:1.1rem 1.25rem;border:1px solid var(--line-strong);border-radius:3px;background:var(--surface);color:var(--ink);cursor:pointer;font-family:inherit;text-align:left;display:flex;align-items:flex-start;gap:.9rem;transition:all .16s}
.mode-btn:hover{border-color:var(--ink);transform:translateY(-1px);box-shadow:0 4px 14px rgba(26,26,26,.08)}
.mode-btn .idx{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.8rem;font-weight:700;line-height:1;color:var(--paper);background:var(--ink);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.mode-btn.primary .idx{background:var(--red)}
.mode-btn.sim .idx{background:var(--charcoal)}
.mode-btn.inf .idx{background:var(--gold-deep);font-size:.95rem}
.mode-btn.weak .idx{background:var(--red);font-size:.72rem}
.mode-btn.weak{border-color:var(--red)}
.mode-btn .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:.25rem}
.mode-btn .t{font-size:1.02rem;font-weight:600;letter-spacing:-.01em;line-height:1.2;display:block}
.mode-btn .d{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.74rem;color:var(--muted);letter-spacing:.01em;line-height:1.35;display:block}
.mode-btn .arr{color:var(--muted-2);font-size:1.1rem;line-height:1;transition:transform .16s;margin-top:3px;flex-shrink:0}
.mode-btn:hover .arr{transform:translateX(3px);color:var(--ink)}

/* Section label */
.sec-label{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.62rem;font-weight:600;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;margin-bottom:.9rem;display:flex;align-items:center;gap:.7rem}
.sec-label::after{content:"";flex:1;height:1px;background:var(--line)}

/* Category buttons */
.cat-btn{width:100%;padding:.8rem 1.1rem .7rem;border:1px solid var(--line);border-radius:3px;background:transparent;color:var(--ink);cursor:pointer;font-family:inherit;display:flex;flex-direction:column;gap:.45rem;margin-bottom:.5rem;transition:all .16s}
.cat-btn .ctop{display:flex;justify-content:space-between;align-items:baseline;gap:.75rem;width:100%}
.cat-btn .cbar{display:block;width:100%;height:2px;background:var(--paper-2);border-radius:2px;overflow:hidden}
.cat-btn .cfill{display:block;height:100%;background:var(--gold-deep);transition:width .4s ease}
.cat-btn:hover{background:var(--surface);border-color:var(--line-strong)}
.cat-btn .cn{font-size:.95rem;font-weight:500}
.cat-btn .cc{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.7rem;color:var(--muted-2);letter-spacing:.02em}

/* Quiz progress */
.pinfo{display:flex;justify-content:space-between;align-items:baseline;font-family:"Helvetica Neue",Arial,sans-serif;font-size:.68rem;letter-spacing:.05em;color:var(--muted);margin-bottom:.5rem;text-transform:uppercase}
.pinfo b{color:var(--ink);font-weight:700}
.pbar{height:2px;background:var(--paper-2);border-radius:2px;overflow:hidden;margin-bottom:1.5rem}
.pfill{height:100%;background:var(--red);transition:width .4s ease}

/* Infinite stats */
.inf-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.6rem;margin-bottom:1.5rem}
.stat-box{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:.8rem .5rem;text-align:center}
.stat-num{font-size:1.5rem;font-weight:700;color:var(--ink);line-height:1}
.stat-num.g{color:var(--gold-deep)}.stat-num.gr{color:var(--green)}
.stat-lbl{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.58rem;color:var(--muted);text-transform:uppercase;letter-spacing:.15em;margin-top:.4rem}

/* Question */
.cat-tag{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.62rem;font-weight:600;letter-spacing:.16em;color:var(--gold-deep);text-transform:uppercase;margin-bottom:.7rem}
.q-card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--red);border-radius:3px;padding:1.5rem;margin-bottom:1.5rem}
.q-text{font-size:1.15rem;line-height:1.5;color:var(--ink);font-weight:500}
.q-trans{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.85rem;line-height:1.5;color:var(--muted);margin-top:.75rem;padding-top:.75rem;border-top:1px solid var(--line)}

/* Options */
.opt{width:100%;padding:.95rem 1.1rem;border:1px solid var(--line-strong);border-radius:3px;background:var(--surface);color:var(--ink);text-align:left;font-family:inherit;font-size:.98rem;line-height:1.45;cursor:pointer;display:flex;align-items:flex-start;gap:.85rem;margin-bottom:.55rem;transition:all .16s}
.opt:hover:not([disabled]){border-color:var(--ink);background:var(--surface);transform:translateX(2px)}
.opt[disabled]{cursor:default}
.opt.correct{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.opt.wrong{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.opt-letter{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.72rem;font-weight:700;color:var(--muted);min-width:18px;padding-top:.12rem;flex-shrink:0}
.opt.correct .opt-letter{color:var(--green)}.opt.wrong .opt-letter{color:var(--red)}
.opt-en{display:block;font-family:"Helvetica Neue",Arial,sans-serif;font-size:.78rem;color:var(--muted-2);margin-top:.25rem}
.opt.correct .opt-en{color:var(--green)}.opt.wrong .opt-en{color:var(--red)}

/* Feedback */
.feedback{padding:.9rem 1.1rem;border-radius:3px;margin-bottom:1rem;font-size:.9rem;font-weight:500;line-height:1.5}
.feedback.ok{background:var(--green-bg);border:1px solid var(--green);color:var(--green)}
.feedback.fail{background:var(--red-bg);border:1px solid var(--red);color:var(--red)}

/* Primary action button */
.act-btn{width:100%;padding:.95rem 1.5rem;border:none;border-radius:3px;background:var(--ink);color:var(--paper);font-family:"Helvetica Neue",Arial,sans-serif;font-size:.82rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;transition:all .16s;margin-bottom:.55rem}
.act-btn:hover{background:var(--red)}
.act-btn.ghost{background:transparent;border:1px solid var(--line-strong);color:var(--ink)}
.act-btn.ghost:hover{background:var(--surface);border-color:var(--ink)}

/* Result */
.result-card{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:2rem 1.5rem;text-align:center;margin-bottom:1.5rem}
.result-card .lbl{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.62rem;font-weight:600;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;margin-bottom:.75rem}
.big-score{font-size:clamp(3.5rem,14vw,5rem);font-weight:700;line-height:.9;letter-spacing:-.03em}
.big-score.pass{color:var(--green)}.big-score.fail{color:var(--red)}
.score-sub{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.8rem;color:var(--muted);margin:.6rem 0 1rem}
.verdict{font-size:1rem;font-weight:600}
.verdict-note{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.72rem;color:var(--muted-2);margin-top:.35rem;font-style:normal}

/* Missed items */
.missed-item{background:var(--surface);border:1px solid var(--line);border-left:2px solid var(--red);border-radius:3px;padding:.9rem 1.1rem;margin-bottom:.5rem}
.missed-meta{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.62rem;letter-spacing:.1em;color:var(--muted-2);text-transform:uppercase;margin-bottom:.35rem}
.missed-q{font-size:.92rem;color:var(--ink);margin-bottom:.4rem;font-weight:500;line-height:1.4}
.missed-q-en{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.78rem;color:var(--muted);margin-bottom:.4rem}
.missed-a{font-size:.9rem;color:var(--green);font-weight:500}
.missed-a-en{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.76rem;color:var(--green);opacity:.85;margin-top:.15rem}

/* Badges */
.badge{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.62rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;text-align:center;margin-bottom:1.25rem;padding:.4rem;border-radius:2px}
.badge.sim{color:var(--charcoal);background:var(--paper-2)}
.badge.inf{color:var(--gold-deep);background:rgba(200,169,78,.14)}
.badge.weak-badge{color:var(--red);background:var(--red-bg)}
.badge.sim #timer{font-variant-numeric:tabular-nums;font-weight:700}
.badge.sim #timer.time-low{color:var(--red)}

.progress-panel{background:var(--surface-2);border:1px solid var(--line);border-radius:3px;padding:1.1rem 1.25rem;margin-bottom:1.5rem}
/* Account pill (top-right, compact) */
.acct-bar{display:flex;justify-content:flex-end;position:relative;z-index:20;margin-bottom:.7rem}
.acct-corner{position:relative}
.acct-pill{display:inline-flex;align-items:center;gap:.4rem;background:var(--surface);border:1px solid var(--line-strong);border-radius:999px;padding:.35rem .6rem .35rem .5rem;cursor:pointer;font-family:"Helvetica Neue",Arial,sans-serif;color:var(--ink);max-width:180px}
.acct-pill:hover,.acct-pill.open{border-color:var(--ink)}
.acct-ico{font-size:.82rem;line-height:1}
.acct-cur-name{font-size:.78rem;font-weight:600;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.acct-caret{font-size:.5rem;color:var(--muted-2)}
.acct-panel{position:absolute;top:calc(100% + .4rem);right:0;min-width:200px;background:var(--surface);border:1px solid var(--line-strong);border-radius:4px;overflow:hidden;box-shadow:0 6px 20px rgba(26,26,26,.14)}
.acct-row{display:flex;align-items:center;gap:.6rem;padding:.6rem .8rem;cursor:pointer;font-family:"Helvetica Neue",Arial,sans-serif;font-size:.85rem;border-bottom:1px solid var(--line)}
.acct-row:hover{background:var(--paper)}
.acct-row.active{background:var(--paper-2)}
.acct-dot{font-size:.55rem;color:var(--gold-deep);flex-shrink:0}
.acct-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct-del{background:none;border:none;color:var(--muted-2);cursor:pointer;font-size:.72rem;padding:.15rem .35rem;border-radius:2px;flex-shrink:0}
.acct-del:hover{color:var(--red);background:var(--red-bg)}
.acct-new{display:flex;gap:.35rem;padding:.55rem .6rem}
.acct-input{flex:1;min-width:0;border:1px solid var(--line-strong);border-radius:3px;padding:.4rem .55rem;font-family:"Helvetica Neue",Arial,sans-serif;font-size:.82rem;background:var(--paper);color:var(--ink)}
.acct-input:focus{outline:none;border-color:var(--ink)}
.acct-add{border:none;background:var(--ink);color:var(--paper);border-radius:3px;width:32px;font-size:1rem;font-weight:600;cursor:pointer;flex-shrink:0}
.acct-add:hover{background:var(--red)}
.acct-cloud{font-size:.7rem;color:var(--gold-deep);margin-left:-.2rem}
.acct-section-label{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.58rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2);padding:.6rem .8rem .3rem}
.auth-block{padding:.4rem .8rem .8rem}
.auth-block.signed{padding:.6rem .8rem .8rem}
.auth-email{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.82rem;font-weight:600;color:var(--ink);word-break:break-all}
.auth-sub{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.68rem;color:var(--gold-deep);margin-top:.2rem}
.auth-signout{margin-top:.6rem;width:100%;border:1px solid var(--line-strong);background:transparent;color:var(--ink);border-radius:3px;padding:.45rem;font-family:"Helvetica Neue",Arial,sans-serif;font-size:.78rem;font-weight:600;cursor:pointer}
.auth-signout:hover{border-color:var(--red);color:var(--red)}
.auth-tabs{display:flex;gap:.3rem;margin-bottom:.5rem}
.auth-tabs button{flex:1;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:3px;padding:.35rem;font-family:"Helvetica Neue",Arial,sans-serif;font-size:.72rem;font-weight:600;cursor:pointer}
.auth-tabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.auth-input{width:100%;border:1px solid var(--line-strong);border-radius:3px;padding:.5rem .6rem;font-family:"Helvetica Neue",Arial,sans-serif;font-size:.82rem;background:var(--paper);color:var(--ink);margin-bottom:.4rem}
.auth-input:focus{outline:none;border-color:var(--ink)}
.auth-go{width:100%;border:none;background:var(--ink);color:var(--paper);border-radius:3px;padding:.5rem;font-family:"Helvetica Neue",Arial,sans-serif;font-size:.8rem;font-weight:600;cursor:pointer}
.auth-go:hover{background:var(--red)}
.auth-go:disabled{opacity:.6;cursor:default}
.auth-err{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.72rem;color:var(--red);margin-bottom:.4rem;line-height:1.3}
.auth-hint{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.66rem;color:var(--muted-2);margin-top:.5rem;line-height:1.4}
/* History */
.hist{border:1px solid var(--line);border-radius:3px;overflow:hidden;background:var(--surface)}
.hist-row{display:flex;align-items:center;gap:.7rem;padding:.6rem .85rem;font-family:"Helvetica Neue",Arial,sans-serif;font-size:.8rem;border-bottom:1px solid var(--line);color:var(--charcoal)}
.hist-row:last-child{border-bottom:none}
.hist-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.hist-dot.pass{background:var(--green)}
.hist-dot.fail{background:var(--red)}
.hist-mode{font-weight:600;color:var(--ink);min-width:72px}
.hist-cat{flex:1;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-score{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
.hist-date{color:var(--muted-2);min-width:78px;text-align:right;font-size:.72rem}
.progress-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.6rem}

.sw-s{background:rgba(200,169,78,.42)}
.progress-stats b{color:var(--ink);font-weight:700}
.kbd-hint{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.68rem;color:var(--muted-2);text-align:center;margin-top:1rem;letter-spacing:.02em}
.kbd-hint kbd{display:inline-block;font-family:inherit;font-size:.66rem;font-weight:600;background:var(--surface);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:3px;padding:.05rem .3rem;color:var(--ink);margin:0 .05rem}
.fade{animation:fadeIn .35s ease}

function loadProfiles(){
  try{ var raw=localStorage.getItem(PKEY); if(raw)pdata=JSON.parse(raw); }catch(e){}
  if(!pdata||typeof pdata!=='object')pdata={profiles:{},current:null};
  if(!pdata.profiles)pdata.profiles={};
  // First run: migrate any older single-profile mastery data
  if(Object.keys(pdata.profiles).length===0){
    var old={};
    try{ var om=localStorage.getItem('ebt_mastery_v1'); if(om)old=JSON.parse(om)||{}; }catch(e){}
    var id='p'+Date.now();
    pdata.profiles[id]={name:'Standard',created:Date.now(),mastery:old,attempts:[]};
    pdata.current=id;
    saveProfiles();
  }
  if(!pdata.current||!pdata.profiles[pdata.current]){
    pdata.current=Object.keys(pdata.profiles)[0];
  }
}

// Push local data up to the user's row (debounced)
var syncTimer=null;
function scheduleSync(){
  if(!sb||!sbUser)return;
  syncState='saving';
  if(syncTimer)clearTimeout(syncTimer);
  syncTimer=setTimeout(pushData,800);
}
function pushData(){
  if(!sb||!sbUser)return;
  sb.from('progress').upsert({user_id:sbUser.id,data:pdata,updated_at:new Date().toISOString()})
    .then(function(res){
      syncState=res.error?'error':'saved';
      var el=document.getElementById('sync-badge'); if(el)el.textContent=syncLabel();
      setTimeout(function(){ if(syncState==='saved'){syncState='';var e2=document.getElementById('sync-badge');if(e2)e2.textContent=syncLabel();} },1500);
    });
}
function syncLabel(){
  if(!sbUser)return '';
  if(syncState==='saving')return 'Synchronisiere…';
  if(syncState==='saved')return 'Gespeichert ✓';
  if(syncState==='error')return 'Sync-Fehler';
  return 'Synchronisiert';
}

// Pull the user's saved data down (on login). Merges guest progress up if server is empty.
function pullData(cb){
  if(!sb||!sbUser){cb&&cb();return;}
  sb.from('progress').select('data').eq('user_id',sbUser.id).maybeSingle()
    .then(function(res){
      var server=res.data&&res.data.data;
      if(server&&server.profiles&&Object.keys(server.profiles).length){
        // Server has data → adopt it as the source of truth
        pdata=server;
        if(!pdata.current||!pdata.profiles[pdata.current])pdata.current=Object.keys(pdata.profiles)[0];
        try{ localStorage.setItem(PKEY,JSON.stringify(pdata)); }catch(e){}
      } else {
        // Server empty → push whatever the guest already had
        pushData();
      }
      cb&&cb();
    });
}

function currentLand(){ return currentProfile().land||''; }

// The pool the user is actually preparing for: 300 general + their 10.
function activeQ(){ return Q.concat(landQuestions()); }
function recordAnswer(id,ok){
  var m=mastery();
  if(!m[id])m[id]={s:0,c:0};
  m[id].s++; if(ok)m[id].c++;
  saveProfiles();
}
// A question counts as mastered only after it has been seen a few times;
// 1/1 from a single lucky guess is not evidence of anything.
var MASTER_MIN=2;
function isMastered(e){ return !!e && e.s>=MASTER_MIN && e.c/e.s>=0.66; }
function masteryStats(){
  var m=mastery(),seen=0,mastered=0;
  var pool=activeQ();
  pool.forEach(function(q){
    var e=m[q.id];
    if(e&&e.s>0){seen++; if(isMastered(e))mastered++;}
  });
  return {seen:seen,mastered:mastered,total:pool.length};
}

  currentProfile().mastery={}; saveProfiles(); render();
}

// ===== Attempt history =====
function recordAttempt(){
  if(state.recorded)return;
  state.recorded=true;
  var sn,tot,pct,passed;
  if(state.mode==='infinite'){
    sn=state.totalCorrect;tot=state.totalDone;pct=Math.round(sn/Math.max(tot,1)*100);passed=true;
  } else {
    sn=state.score;tot=state.questions.length;pct=Math.round(sn/Math.max(tot,1)*100);
    passed=state.mode==='sim'?state.score>=17:pct>=70;
  }
  var p=currentProfile();
  if(!p.attempts)p.attempts=[];
  p.attempts.unshift({mode:state.mode,cat:state.selCat,score:sn,total:tot,pct:pct,passed:passed,date:Date.now(),timedOut:(state.mode==='sim'&&state.timeLeft===0)});
  if(p.attempts.length>100)p.attempts=p.attempts.slice(0,100);
  saveProfiles();
}
function completeQuiz(){ state.screen='result'; recordAttempt(); render(); }

function weakQuestions(){
  var m=mastery();
  return activeQ().filter(function(q){
    var e=m[q.id];
    return e&&e.s>0&&e.c/e.s<0.66;
  }).sort(function(a,b){
    var ea=m[a.id],eb=m[b.id];
    return (ea.c/ea.s)-(eb.c/eb.s);
  });
}

function startQuiz(cat,mode){
  mode=mode||'normal';
  var pool;
  if(cat==='weak'){
    pool=weakQuestions();
    if(pool.length===0){ state={screen:'home'}; render(); return; }
  } else {
    pool=cat==='all'?activeQ():(cat==='land'?landQuestions():Q.filter(function(q){return q.cat===cat}));
    if(pool.length===0){ state={screen:'home'}; render(); return; }
  }
  if(mode==='infinite'){
    var rem=shuffle(pool);
    state={screen:'quiz',mode:'infinite',questions:[rem[0]],cur:0,sel:null,answered:false,score:0,results:[],selCat:cat,rem:rem.slice(1),totalDone:0,totalCorrect:0,round:1};
  } else {
    var qs;
    if(mode==='sim'){
      // Real test: 33 questions = 30 general + 3 from your Bundesland.
      var lq=shuffle(landQuestions());
      qs=lq.length>=3?shuffle(shuffle(Q).slice(0,30).concat(lq.slice(0,3)))
                     :shuffle(Q).slice(0,33);
    } else {
      qs=(cat==='weak'?pool:shuffle(pool)).slice(0,Math.min(33,pool.length));
    }
    state={screen:'quiz',mode:mode,questions:qs,cur:0,sel:null,answered:false,score:0,results:[],selCat:cat,rem:[],totalDone:0,totalCorrect:0,round:1};
  }
  // Timer for simulation mode (60 min like the real test)
  stopTimer();
  if(mode==='sim'){
    state.timeLeft=60*60;
    timerInterval=setInterval(tick,1000);
  }
  render();
}

var timerInterval=null;
function stopTimer(){ if(timerInterval){clearInterval(timerInterval);timerInterval=null;} }
function tick(){
  if(state.mode!=='sim'||state.screen!=='quiz'){stopTimer();return;}
  state.timeLeft--;
  if(state.timeLeft<=0){
    state.timeLeft=0;stopTimer();
    completeQuiz();return;
  }
  // Only update the timer display, not full re-render (avoids losing selection)
  var el=document.getElementById('timer');
  if(el)el.textContent=fmtTime(state.timeLeft);
  else render();
}
function fmtTime(s){
  var m=Math.floor(s/60),ss=s%60;
  return m+':'+(ss<10?'0':'')+ss;
}

function answer(i){
  if(state.answered)return;
  var q=state.questions[state.cur];
  var ok=i===q.a;
  state.sel=i;state.answered=true;
  if(ok)state.score++;
  recordAnswer(q.id,ok);
  if(state.mode==='infinite'){
    state.totalDone++;
    if(ok)state.totalCorrect++;
    else state.rem.push(q);
  }
  state.results.push({q:q,sel:i,ok:ok});
  render(true);
  revealAction();
}

function next(){
  if(state.mode==='infinite'){
    if(state.rem.length===0){
      var wrong=state.results.filter(function(r){return!r.ok}).map(function(r){return r.q;});
      if(wrong.length===0){completeQuiz();return;}
      state.round++;
      var nq=shuffle(wrong);
      state.questions=[nq[0]];state.rem=nq.slice(1);
      state.cur=0;state.sel=null;state.answered=false;state.score=0;state.results=[];
      render();return;
    }
    var nextQ=state.rem[0];state.rem=state.rem.slice(1);
    state.questions=[nextQ];state.cur=0;state.sel=null;state.answered=false;
    render();return;
  }
  if(state.cur+1>=state.questions.length){stopTimer();completeQuiz();return;}
  state.cur++;state.sel=null;state.answered=false;render();
}

function home(){stopTimer();state.screen='home';render();}

function exitQuiz(){
  var started=state.cur>0||state.answered||state.results.length>0;
  if(started&&!confirm('Test wirklich beenden? Das Ergebnis dieses Durchgangs wird nicht gespeichert.'))return;
  home();
}

// After answering, keep the reader where they are and make sure the
// advance button is on screen instead of just below the fold.
function revealAction(){
  var btn=document.querySelector('#app .act-btn');
  if(!btn)return;
  var r=btn.getBoundingClientRect();
  var vh=window.innerHeight||document.documentElement.clientHeight;
  var over=r.bottom-(vh-16);
  if(over<=0)return;
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  try{window.scrollBy({top:over,behavior:reduce?'auto':'smooth'});}
  catch(e){window.scrollBy(0,over);}
}

    '<div class="modes">'+
    '<button class="mode-btn primary" onclick="startQuiz(\'all\',\'normal\')"><span class="idx">1</span><span class="body"><span class="t">Übungstest</span><span class="d">33 zufällige Fragen aus allen Themen</span></span><span class="arr">→</span></button>'+
    '<button class="mode-btn sim" onclick="startQuiz(\'all\',\'sim\')"><span class="idx">2</span><span class="body"><span class="t">Prüfungssimulation</span><span class="d">33 Fragen mit Bestanden-Bewertung</span></span><span class="arr">→</span></button>'+
    '<button class="mode-btn inf" onclick="startQuiz(\'all\',\'infinite\')"><span class="idx">∞</span><span class="body"><span class="t">Endlos-Modus</span><span class="d">Alle Fragen, falsche werden wiederholt</span></span><span class="arr">→</span></button>'+
    landBtn+weakBtn+
    '</div>'+
    '<div class="sec-label">Nach Thema üben</div>'+cats+
    renderHistory()+
    '<div class="credit">Fragen und amtliche Abbildungen: BAMF-Gesamtfragenkatalog (Stand 07.05.2025) · Reichstag-Foto: Jürgen Matern, CC BY-SA 3.0, via Wikimedia Commons</div>'+
    '</div>';
}

function renderQuiz(){
  var q=state.questions[state.cur];
  var tr=TRANS[q.id]||{qt:'',ot:['','','','']};
  var progHtml='';
  if(state.mode==='infinite'){
    progHtml='<div class="inf-stats">'+
      '<div class="stat-box"><div class="stat-num g">'+state.round+'</div><div class="stat-lbl">Runde</div></div>'+
      '<div class="stat-box"><div class="stat-num gr">'+state.totalCorrect+'</div><div class="stat-lbl">Richtig</div></div>'+
      '<div class="stat-box"><div class="stat-num">'+(state.rem.length+1)+'</div><div class="stat-lbl">Übrig</div></div>'+
    '</div>';
  } else {
    var pct=Math.round((state.cur+(state.answered?1:0))/state.questions.length*100);
    progHtml='<div class="pinfo"><span>'+h(catLabel(state.selCat))+'</span><span><b>'+(state.cur+1)+'</b> / '+state.questions.length+' · ✓ '+state.score+'</span></div>'+
      '<div class="pbar"><div class="pfill" style="width:'+pct+'%"></div></div>';
  }
  var badge=state.mode==='sim'?'<div class="badge sim">Prüfungssimulation · <span id="timer" class="'+((state.timeLeft||3600)<=300?'time-low':'')+'">'+fmtTime(state.timeLeft||3600)+'</span></div>':
            state.mode==='infinite'?'<div class="badge inf">∞ Endlos-Modus</div>':
            state.selCat==='weak'?'<div class="badge weak-badge">★ Schwache Fragen</div>':'';
  var isImg=!!q.im;
  var opts=q.o.map(function(opt,i){
    var cls='opt';
    if(state.answered){if(i===q.a)cls+=' correct';else if(i===state.sel)cls+=' wrong';}
    var enSpan=showTrans?'<span class="opt-en">'+h(tr.ot[i]||'')+'</span>':'';
    var body=isImg?'<span class="opt-img"><img src="'+h(q.im[i])+'" alt="Bild '+(i+1)+'" loading="lazy"></span>'
                  :'<span><span>'+h(opt)+'</span>'+enSpan+'</span>';
    return '<button class="'+cls+'"'+(state.answered?' disabled':'')+' onclick="answer('+i+')">'+
      '<span class="opt-letter">'+String.fromCharCode(65+i)+'</span>'+body+'</button>';
  }).join('');
  var fb='';
  if(state.answered){
    var ok=state.sel===q.a;
    var nl=state.mode==='infinite'?(state.rem.length===0?'Runde abschließen →':'Nächste Frage →'):(state.cur+1>=state.questions.length?'Ergebnis anzeigen →':'Nächste Frage →');
    fb='<div class="feedback '+(ok?'ok':'fail')+'">'+(ok?'✓ Richtig':'✗ Falsch — richtig ist: '+h(q.o[q.a]))+'</div>'+
       '<button class="act-btn" onclick="next()">'+nl+'</button>';
  }
  var hint=state.answered?'':'<div class="kbd-hint">Tipp: Tasten <kbd>A</kbd>–<kbd>D</kbd> oder <kbd>1</kbd>–<kbd>4</kbd> zum Antworten</div>';
  return '<div class="fade">'+
    '<div class="qtop"><button class="exit-btn" onclick="exitQuiz()">← Beenden</button>'+renderToggle()+'</div>'+
    badge+progHtml+
    '<div class="cat-tag">Frage '+q.id+' · '+h(q.cat)+'</div>'+
    '<div class="q-card"><p class="q-text">'+h(q.q)+'</p>'+(showTrans&&tr.qt?'<p class="q-trans">'+h(tr.qt)+'</p>':'')+(q.qim?'<img class="q-img" src="'+h(q.qim)+'" alt="" loading="lazy">':'')+
    '</div><div'+(isImg?' class="opts-img"':'')+'>'+opts+'</div>'+fb+hint+'</div>';
}

function renderResult(){
  var pct=state.mode==='infinite'?Math.round(state.totalCorrect/Math.max(state.totalDone,1)*100):Math.round(state.score/state.questions.length*100);
  var sn=state.mode==='infinite'?state.totalCorrect:state.score;
  var tot=state.mode==='infinite'?state.totalDone:state.questions.length;
  var passed=state.mode==='sim'?state.score>=17:pct>=70;
  var cls=passed?'pass':'fail';
  var verdict;
  if(state.mode==='infinite'){
    verdict='<div class="verdict" style="color:var(--green)">Alle Fragen gemeistert</div><div class="verdict-note">Abgeschlossen in '+state.round+' Runde(n)</div>';
  } else if(state.mode==='sim'){
    var timedOut=state.timeLeft===0;
    var note=timedOut?'Zeit abgelaufen — '+(state.score>=17?'trotzdem bestanden!':'mind. 17 von 33 nötig'):(state.score>=17?'Sie haben die Bestehensgrenze erreicht':'Mindestens 17 von 33 nötig');
    verdict='<div class="verdict" style="color:'+(state.score>=17?'var(--green)':'var(--red)')+'">'+(state.score>=17?'Bestanden':'Nicht bestanden')+'</div><div class="verdict-note">'+note+'</div>';
  } else {
    verdict='<div class="verdict" style="color:'+(pct>=70?'var(--green)':pct>=50?'var(--gold-deep)':'var(--red)')+'">'+(pct>=70?'Ausgezeichnet':pct>=50?'Gut gemacht':'Weiter üben')+'</div>';
  }
  var missed=state.results.filter(function(r){return!r.ok;});
  var mHtml=missed.length?'<div class="sec-label">Zum Wiederholen</div>'+
    missed.map(function(r){
      var tr=TRANS[r.q.id]||{qt:'',ot:['','','','']};
      return '<div class="missed-item"><div class="missed-meta">Frage '+r.q.id+' · '+h(r.q.cat)+'</div>'+
        '<div class="missed-q">'+h(r.q.q)+'</div>'+
        (showTrans&&tr.qt?'<div class="missed-q-en">'+h(tr.qt)+'</div>':'')+
        (r.q.im?'<div class="missed-a">✓ Bild '+(r.q.a+1)+'</div><img class="missed-img" src="'+h(r.q.im[r.q.a])+'" alt="" loading="lazy">'
               :'<div class="missed-a">✓ '+h(r.q.o[r.q.a])+'</div>')+
        (showTrans&&tr.ot[r.q.a]?'<div class="missed-a-en">'+h(tr.ot[r.q.a])+'</div>':'')+
      '</div>';
    }).join(''):'';
  var cat=h(state.selCat).replace(/'/g,"\\'");
  var retryBtn=state.mode==='infinite'?
    '<button class="act-btn" onclick="startQuiz(\'' + cat + '\',\'infinite\')">Nochmal starten</button>':
    '<button class="act-btn" onclick="startQuiz(\'' + cat + '\',\'' + state.mode + '\')">Nochmal versuchen</button>';
  var badge=state.mode==='sim'?'<div class="badge sim">Prüfungssimulation</div>':
            state.mode==='infinite'?'<div class="badge inf">∞ Endlos-Modus</div>':'';
  return '<div class="fade">'+renderToggle()+badge+
    '<div class="result-card"><div class="lbl">Ihr Ergebnis</div>'+
    '<div class="big-score '+cls+'">'+sn+'</div>'+
    '<div class="score-sub">von '+tot+' Fragen richtig · '+pct+'%</div>'+
    verdict+'</div>'+mHtml+
    '<div style="margin-top:1.25rem">'+retryBtn+
    '<button class="act-btn ghost" onclick="home()">← Zurück zum Start</button></div></div>';
}

window.startQuiz=startQuiz;window.answer=answer;window.next=next;window.home=home;window.toggleTrans=toggleTrans;window.exitQuiz=exitQuiz;window.setLand=setLand;window.resetMastery=resetMastery;
window.switchProfile=switchProfile;window.deleteProfile=deleteProfile;window.createProfile=createProfile;
window.toggleAccounts=toggleAccounts;window.submitAccount=submitAccount;window.setDraft=setDraft;
window.toggleAuth=toggleAuth;window.setAuthMode=setAuthMode;window.setAuthEmail=setAuthEmail;window.setAuthPass=setAuthPass;
window.signIn=signIn;window.signUp=signUp;window.signOut=signOut;

function renderAccounts(){
  var ab=document.getElementById('acctbar');
  if(!ab)return;
  var hide=state.screen==='quiz';
  ab.style.display=hide?'none':'flex';
  ab.innerHTML=hide?'':renderAccountBar();
}
function toggleAccounts(){ showAccounts=!showAccounts; renderAccounts(); }
function setDraft(v){ accountDraft=v; }
function submitAccount(){ createProfile(accountDraft); render(); }

// Keyboard shortcuts
document.addEventListener('keydown',function(e){
  if(state.screen!=='quiz')return;
  if(e.key==='Escape'){e.preventDefault();exitQuiz();return;}
  var q=state.questions[state.cur];
  if(!state.answered){
    // A-D or 1-4 to answer
    var k=e.key.toLowerCase();
    var idx=-1;
    if(k>='1'&&k<='4')idx=parseInt(k)-1;
    else if(k>='a'&&k<='d')idx=k.charCodeAt(0)-97;
    if(idx>=0&&idx<q.o.length){e.preventDefault();answer(idx);}
  } else {
    // Enter or Space to advance
    if(e.key==='Enter'||e.key===' '){e.preventDefault();next();}
  }
});

loadProfiles();
render();

// Offline support; harmless where service workers are unavailable.
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
initAuth(function(){ render(); });

</script>
