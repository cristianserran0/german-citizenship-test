<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Einbürgerungstest — Staatsbürgerkunde</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1a1a1a;--paper:#f4f1e8;--paper-2:#eae5d6;
  --gold:#c8a94e;--gold-deep:#9a7d2e;
  --red:#b5231f;--charcoal:#2b2b2b;
  --line:rgba(26,26,26,.14);--line-strong:rgba(26,26,26,.28);
  --muted:#6b6456;--muted-2:#8a8375;
  --green:#2f6b3f;--green-bg:rgba(47,107,63,.1);
  --red-bg:rgba(181,35,31,.08);
}
body{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;background:var(--paper);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
.bg-seal{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.035;background-image:radial-gradient(circle at 50% 42%,var(--ink) 0 1px,transparent 1px);background-size:22px 22px}
.wrap{max-width:640px;margin:0 auto;padding:2.5rem 1.25rem 4rem;position:relative;z-index:1}

/* Header */
.header{text-align:center;margin-bottom:2.5rem;padding-bottom:1.75rem;border-bottom:1px solid var(--line)}
.flag{display:flex;justify-content:center;gap:0;margin:0 auto 1.25rem;width:64px;height:8px;border-radius:1px;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.15)}
.flag i{flex:1}.flag .k{background:#111}.flag .r{background:var(--red)}.flag .g{background:var(--gold)}
.eyebrow{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.62rem;font-weight:600;letter-spacing:.32em;color:var(--muted);text-transform:uppercase;margin-bottom:.6rem}
h1{font-size:clamp(1.7rem,5vw,2.3rem);font-weight:600;color:var(--ink);letter-spacing:-.01em;line-height:1.05}
.sub{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.68rem;letter-spacing:.18em;color:var(--muted-2);text-transform:uppercase;margin-top:.65rem}

/* Language toggle */
.lang-row{display:flex;align-items:center;gap:.6rem;justify-content:center;margin-bottom:1.75rem}
.lang-row span{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.66rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.tog-wrap{position:relative;width:42px;height:23px;cursor:pointer;display:inline-block}
.tog-wrap input{opacity:0;width:0;height:0;position:absolute}
.tog-track{position:absolute;inset:0;background:var(--paper-2);border-radius:12px;border:1px solid var(--line-strong);transition:all .2s}
.tog-thumb{position:absolute;top:3px;left:3px;width:15px;height:15px;background:var(--muted);border-radius:50%;transition:all .2s}
.tog-wrap input:checked~.tog-track{background:var(--gold);border-color:var(--gold-deep)}
.tog-wrap input:checked~.tog-thumb{left:24px;background:#fff}

/* Intro card */
.intro{background:rgba(255,255,255,.5);border:1px solid var(--line);border-radius:3px;padding:1.4rem 1.5rem;margin-bottom:1.5rem}
.intro p{font-size:.96rem;line-height:1.65;color:var(--charcoal)}
.intro .lead{font-size:.72rem;font-family:"Helvetica Neue",Arial,sans-serif;letter-spacing:.03em;color:var(--muted);margin-top:.85rem;display:flex;gap:1.25rem;flex-wrap:wrap}
.intro .lead b{color:var(--ink);font-weight:600}

/* Mode buttons */
.modes{display:flex;flex-direction:column;gap:.7rem;margin-bottom:2.25rem}
.mode-btn{width:100%;padding:1.1rem 1.25rem;border:1px solid var(--line-strong);border-radius:3px;background:#fff;color:var(--ink);cursor:pointer;font-family:inherit;text-align:left;display:flex;align-items:flex-start;gap:.9rem;transition:all .16s}
.mode-btn:hover{border-color:var(--ink);transform:translateY(-1px);box-shadow:0 4px 14px rgba(26,26,26,.08)}
.mode-btn .idx{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.8rem;font-weight:700;line-height:1;color:#fff;background:var(--ink);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.mode-btn.primary .idx{background:var(--red)}
.mode-btn.sim .idx{background:var(--charcoal)}
.mode-btn.inf .idx{background:var(--gold-deep);font-size:.95rem}
.mode-btn.weak .idx{background:var(--red);font-size:.72rem}
.mode-btn.weak{border-color:var(--red)}
.mode-btn .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:.25rem}
.mode-btn .t{font-size:1.02rem;font-weight:600;letter-spacing:-.01em;line-height:1.2;display:block}
.mode-btn .d{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.74rem;color:var(--muted);letter-spacing:.01em;line-height:1.35;display:block}
.mode-btn .arr{color:var(--muted-2);font-size:1.1rem;line-height:1;transition:transform .16s;margin-top:3px;flex-shrink:0}
.mode-btn:hover .arr{transform:translateX(3px);color:var(--ink)}

/* Section label */
.sec-label{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.62rem;font-weight:600;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;margin-bottom:.9rem;display:flex;align-items:center;gap:.7rem}
.sec-label::after{content:"";flex:1;height:1px;background:var(--line)}

/* Category buttons */
.cat-btn{width:100%;padding:.85rem 1.1rem;border:1px solid var(--line);border-radius:3px;background:transparent;color:var(--ink);cursor:pointer;font-family:inherit;display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem;transition:all .16s}
.cat-btn:hover{background:#fff;border-color:var(--line-strong)}
.cat-btn .cn{font-size:.95rem;font-weight:500}
.cat-btn .cc{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.7rem;color:var(--muted-2);letter-spacing:.02em}

/* Quiz progress */
.pinfo{display:flex;justify-content:space-between;align-items:baseline;font-family:"Helvetica Neue",Arial,sans-serif;font-size:.68rem;letter-spacing:.05em;color:var(--muted);margin-bottom:.5rem;text-transform:uppercase}
.pinfo b{color:var(--ink);font-weight:700}
.pbar{height:2px;background:var(--paper-2);border-radius:2px;overflow:hidden;margin-bottom:1.5rem}
.pfill{height:100%;background:var(--red);transition:width .4s ease}

/* Infinite stats */
.inf-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.6rem;margin-bottom:1.5rem}
.stat-box{background:#fff;border:1px solid var(--line);border-radius:3px;padding:.8rem .5rem;text-align:center}
.stat-num{font-size:1.5rem;font-weight:700;color:var(--ink);line-height:1}
.stat-num.g{color:var(--gold-deep)}.stat-num.gr{color:var(--green)}
.stat-lbl{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.58rem;color:var(--muted);text-transform:uppercase;letter-spacing:.15em;margin-top:.4rem}

/* Question */
.cat-tag{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.62rem;font-weight:600;letter-spacing:.16em;color:var(--gold-deep);text-transform:uppercase;margin-bottom:.7rem}
.q-card{background:#fff;border:1px solid var(--line);border-left:3px solid var(--red);border-radius:3px;padding:1.5rem;margin-bottom:1.5rem}
.q-text{font-size:1.15rem;line-height:1.5;color:var(--ink);font-weight:500}
.q-trans{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.85rem;line-height:1.5;color:var(--muted);margin-top:.75rem;padding-top:.75rem;border-top:1px solid var(--line)}

/* Options */
.opt{width:100%;padding:.95rem 1.1rem;border:1px solid var(--line-strong);border-radius:3px;background:#fff;color:var(--ink);text-align:left;font-family:inherit;font-size:.98rem;line-height:1.45;cursor:pointer;display:flex;align-items:flex-start;gap:.85rem;margin-bottom:.55rem;transition:all .16s}
.opt:hover:not([disabled]){border-color:var(--ink);background:#fff;transform:translateX(2px)}
.opt[disabled]{cursor:default}
.opt.correct{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.opt.wrong{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.opt-letter{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.72rem;font-weight:700;color:var(--muted);min-width:18px;padding-top:.12rem;flex-shrink:0}
.opt.correct .opt-letter{color:var(--green)}.opt.wrong .opt-letter{color:var(--red)}
.opt-en{display:block;font-family:"Helvetica Neue",Arial,sans-serif;font-size:.78rem;color:var(--muted-2);margin-top:.25rem}
.opt.correct .opt-en{color:var(--green)}.opt.wrong .opt-en{color:var(--red)}

/* Feedback */
.feedback{padding:.9rem 1.1rem;border-radius:3px;margin-bottom:1rem;font-size:.9rem;font-weight:500;line-height:1.5}
.feedback.ok{background:var(--green-bg);border:1px solid var(--green);color:var(--green)}
.feedback.fail{background:var(--red-bg);border:1px solid var(--red);color:var(--red)}

/* Primary action button */
.act-btn{width:100%;padding:.95rem 1.5rem;border:none;border-radius:3px;background:var(--ink);color:var(--paper);font-family:"Helvetica Neue",Arial,sans-serif;font-size:.82rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;transition:all .16s;margin-bottom:.55rem}
.act-btn:hover{background:var(--red)}
.act-btn.ghost{background:transparent;border:1px solid var(--line-strong);color:var(--ink)}
.act-btn.ghost:hover{background:#fff;border-color:var(--ink)}

/* Result */
.result-card{background:#fff;border:1px solid var(--line);border-radius:3px;padding:2rem 1.5rem;text-align:center;margin-bottom:1.5rem}
.result-card .lbl{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.62rem;font-weight:600;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;margin-bottom:.75rem}
.big-score{font-size:clamp(3.5rem,14vw,5rem);font-weight:700;line-height:.9;letter-spacing:-.03em}
.big-score.pass{color:var(--green)}.big-score.fail{color:var(--red)}
.score-sub{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.8rem;color:var(--muted);margin:.6rem 0 1rem}
.verdict{font-size:1rem;font-weight:600}
.verdict-note{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.72rem;color:var(--muted-2);margin-top:.35rem;font-style:normal}

/* Missed items */
.missed-item{background:#fff;border:1px solid var(--line);border-left:2px solid var(--red);border-radius:3px;padding:.9rem 1.1rem;margin-bottom:.5rem}
.missed-meta{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.62rem;letter-spacing:.1em;color:var(--muted-2);text-transform:uppercase;margin-bottom:.35rem}
.missed-q{font-size:.92rem;color:var(--ink);margin-bottom:.4rem;font-weight:500;line-height:1.4}
.missed-q-en{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.78rem;color:var(--muted);margin-bottom:.4rem}
.missed-a{font-size:.9rem;color:var(--green);font-weight:500}
.missed-a-en{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.76rem;color:var(--green);opacity:.85;margin-top:.15rem}

/* Badges */
.badge{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.62rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;text-align:center;margin-bottom:1.25rem;padding:.4rem;border-radius:2px}
.badge.sim{color:var(--charcoal);background:var(--paper-2)}
.badge.inf{color:var(--gold-deep);background:rgba(200,169,78,.14)}
.badge.weak-badge{color:var(--red);background:var(--red-bg)}
.badge.sim #timer{font-variant-numeric:tabular-nums;font-weight:700}
.badge.sim #timer.time-low{color:var(--red)}

.progress-panel{background:rgba(255,255,255,.5);border:1px solid var(--line);border-radius:3px;padding:1.1rem 1.25rem;margin-bottom:1.5rem}
/* Account pill (top-right, compact) */
.acct-corner{position:absolute;top:0;right:0;z-index:20}
.acct-pill{display:inline-flex;align-items:center;gap:.4rem;background:#fff;border:1px solid var(--line-strong);border-radius:999px;padding:.35rem .6rem .35rem .5rem;cursor:pointer;font-family:"Helvetica Neue",Arial,sans-serif;color:var(--ink);max-width:180px}
.acct-pill:hover,.acct-pill.open{border-color:var(--ink)}
.acct-ico{font-size:.82rem;line-height:1}
.acct-cur-name{font-size:.78rem;font-weight:600;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.acct-caret{font-size:.5rem;color:var(--muted-2)}
.acct-panel{position:absolute;top:calc(100% + .4rem);right:0;min-width:200px;background:#fff;border:1px solid var(--line-strong);border-radius:4px;overflow:hidden;box-shadow:0 6px 20px rgba(26,26,26,.14)}
.acct-row{display:flex;align-items:center;gap:.6rem;padding:.6rem .8rem;cursor:pointer;font-family:"Helvetica Neue",Arial,sans-serif;font-size:.85rem;border-bottom:1px solid var(--line)}
.acct-row:hover{background:var(--paper)}
.acct-row.active{background:var(--paper-2)}
.acct-dot{font-size:.55rem;color:var(--gold-deep);flex-shrink:0}
.acct-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct-del{background:none;border:none;color:var(--muted-2);cursor:pointer;font-size:.72rem;padding:.15rem .35rem;border-radius:2px;flex-shrink:0}
.acct-del:hover{color:var(--red);background:var(--red-bg)}
.acct-new{display:flex;gap:.35rem;padding:.55rem .6rem}
.acct-input{flex:1;min-width:0;border:1px solid var(--line-strong);border-radius:3px;padding:.4rem .55rem;font-family:"Helvetica Neue",Arial,sans-serif;font-size:.82rem;background:var(--paper);color:var(--ink)}
.acct-input:focus{outline:none;border-color:var(--ink)}
.acct-add{border:none;background:var(--ink);color:var(--paper);border-radius:3px;width:32px;font-size:1rem;font-weight:600;cursor:pointer;flex-shrink:0}
.acct-add:hover{background:var(--red)}
/* History */
.hist{border:1px solid var(--line);border-radius:3px;overflow:hidden;background:#fff}
.hist-row{display:flex;align-items:center;gap:.7rem;padding:.6rem .85rem;font-family:"Helvetica Neue",Arial,sans-serif;font-size:.8rem;border-bottom:1px solid var(--line);color:var(--charcoal)}
.hist-row:last-child{border-bottom:none}
.hist-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.hist-dot.pass{background:var(--green)}
.hist-dot.fail{background:var(--red)}
.hist-mode{font-weight:600;color:var(--ink);min-width:72px}
.hist-cat{flex:1;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-score{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
.hist-date{color:var(--muted-2);min-width:78px;text-align:right;font-size:.72rem}
.progress-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.6rem}
.progress-label{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.62rem;font-weight:600;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.reset-link{background:none;border:none;font-family:"Helvetica Neue",Arial,sans-serif;font-size:.66rem;color:var(--muted-2);cursor:pointer;text-decoration:underline;padding:0}
.reset-link:hover{color:var(--red)}
.progress-bar{height:6px;background:var(--paper-2);border-radius:3px;overflow:hidden;margin-bottom:.5rem}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold-deep),var(--gold));transition:width .5s ease}
.progress-stats{display:flex;justify-content:space-between;font-family:"Helvetica Neue",Arial,sans-serif;font-size:.72rem;color:var(--muted)}
.progress-stats b{color:var(--ink);font-weight:700}
.kbd-hint{font-family:"Helvetica Neue",Arial,sans-serif;font-size:.68rem;color:var(--muted-2);text-align:center;margin-top:1rem;letter-spacing:.02em}
.kbd-hint kbd{display:inline-block;font-family:inherit;font-size:.66rem;font-weight:600;background:#fff;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:3px;padding:.05rem .3rem;color:var(--ink);margin:0 .05rem}
.fade{animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
</style>
</head>
<body>
<div class="bg-seal"></div>
<div class="wrap">
  <header class="header">
    <div class="flag"><i class="k"></i><i class="r"></i><i class="g"></i></div>
    <div class="eyebrow">Einbürgerungstest · Vorbereitung</div>
    <h1>Staatsbürgerkunde</h1>
    <div class="sub">300 offizielle BAMF-Fragen</div>
  </header>
  <div id="app"></div>
  <div class="spacer"></div>
</div>
<script>var Q=[
{id:1,cat:"Demokratie",q:"In Deutschland dürfen Menschen offen etwas gegen die Regierung sagen, weil ...",o:["hier Religionsfreiheit gilt.","die Menschen Steuern zahlen.","die Menschen das Wahlrecht haben.","hier Meinungsfreiheit gilt."],a:3},
{id:2,cat:"Gesellschaft",q:"In Deutschland können Eltern bis zum 14. Lebensjahr ihres Kindes entscheiden, ob es in der Schule am ... teilnimmt.",o:["Geschichtsunterricht","Religionsunterricht","Politikunterricht","Sprachunterricht"],a:1},
{id:3,cat:"Demokratie",q:"Deutschland ist ein Rechtsstaat. Was ist damit gemeint?",o:["Alle Einwohner und der Staat müssen sich an die Gesetze halten.","Der Staat muss sich nicht an die Gesetze halten.","Nur Deutsche müssen die Gesetze befolgen.","Die Gerichte machen die Gesetze."],a:0},
{id:4,cat:"Demokratie",q:"Welches Recht gehört zu den Grundrechten in Deutschland?",o:["Waffenbesitz","Faustrecht","Meinungsfreiheit","Selbstjustiz"],a:2},
{id:5,cat:"Wahlen",q:"Wahlen in Deutschland sind frei. Was bedeutet das?",o:["Man darf Geld annehmen, wenn man dafür einen bestimmten Kandidaten wählt.","Der Wähler darf weder beeinflusst noch zu einer bestimmten Stimmabgabe gezwungen werden.","Nur Personen, die noch nie im Gefängnis waren, dürfen wählen.","Alle wahlberechtigten Personen müssen wählen."],a:1},
{id:6,cat:"Demokratie",q:"Wie heißt die deutsche Verfassung?",o:["Volksgesetz","Bundesgesetz","Deutsches Gesetz","Grundgesetz"],a:3},
{id:7,cat:"Demokratie",q:"Welches Recht gehört zu den Grundrechten nach der deutschen Verfassung?",o:["Glaubens- und Gewissensfreiheit","Unterhaltung","Arbeit","Wohnung"],a:0},
{id:8,cat:"Demokratie",q:"Was steht nicht im Grundgesetz von Deutschland?",o:["Die Würde des Menschen ist unantastbar.","Alle sollen gleich viel Geld haben.","Jeder Mensch darf seine Meinung sagen.","Alle sind vor dem Gesetz gleich."],a:1},
{id:9,cat:"Demokratie",q:"Welches Grundrecht gilt in Deutschland nur für Ausländer? Das Grundrecht auf ...",o:["Schutz der Familie","Menschenwürde","Asyl","Meinungsfreiheit"],a:2},
{id:10,cat:"Demokratie",q:"Was ist mit dem deutschen Grundgesetz vereinbar?",o:["die Prügelstrafe","die Folter","die Todesstrafe","die Geldstrafe"],a:3},
{id:11,cat:"Demokratie",q:"Wie wird die Verfassung der Bundesrepublik Deutschland genannt?",o:["Grundgesetz","Bundesverfassung","Gesetzbuch","Verfassungsvertrag"],a:0},
{id:12,cat:"Demokratie",q:"Eine Partei im Deutschen Bundestag will die Pressefreiheit abschaffen. Ist das möglich?",o:["Ja, wenn mehr als die Hälfte der Abgeordneten dafür sind.","Ja, aber dazu müssen zwei Drittel der Abgeordneten dafür sein.","Nein, die Pressefreiheit ist ein Grundrecht und kann nicht abgeschafft werden.","Nein, denn nur der Bundesrat kann die Pressefreiheit abschaffen."],a:2},
{id:13,cat:"Demokratie",q:"Im Parlament steht der Begriff Opposition für ...",o:["die regierenden Parteien.","alle Abgeordneten, die nicht zur Regierungspartei gehören.","die Fraktion mit den meisten Abgeordneten.","alle Parteien, die die 5%-Hürde erreichen konnten."],a:1},
{id:14,cat:"Demokratie",q:"Meinungsfreiheit in Deutschland heißt zum Beispiel, dass ich ...",o:["Passanten auf der Straße beschimpfen darf.","meine Meinung im Internet äußern kann.","Nazi-Symbole öffentlich tragen darf.","meine Meinung nur äußern darf, wenn ich der Regierung nicht widerspreche."],a:1},
{id:15,cat:"Demokratie",q:"Was verbietet das deutsche Grundgesetz?",o:["Militärdienst","Zwangsarbeit","freie Berufswahl","Arbeit im Ausland"],a:1},
{id:16,cat:"Demokratie",q:"Wann ist die Meinungsfreiheit in Deutschland eingeschränkt?",o:["bei der öffentlichen Verbreitung falscher Behauptungen über einzelne Personen","bei Meinungsäußerungen über die Bundesregierung","bei Diskussionen über Religionen","bei Kritik am Staat"],a:0},
{id:17,cat:"Demokratie",q:"Die deutschen Gesetze verbieten ...",o:["Meinungsfreiheit der Einwohner.","Petitionen der Bürger.","Versammlungsfreiheit der Einwohner.","Ungleichbehandlung der Bürger durch den Staat."],a:3},
{id:18,cat:"Demokratie",q:"Welches Grundrecht ist in Artikel 1 des Grundgesetzes garantiert?",o:["die Unantastbarkeit der Menschenwürde","das Recht auf Leben","Religionsfreiheit","Meinungsfreiheit"],a:0},
{id:19,cat:"Demokratie",q:"Was versteht man unter dem Recht der Freizügigkeit in Deutschland?",o:["Man darf sich seinen Wohnort selbst aussuchen.","Man kann seinen Beruf wechseln.","Man darf sich für eine andere Religion entscheiden.","Man darf sich in der Öffentlichkeit nur leicht bekleidet bewegen."],a:0},

var showTrans=false;
function toggleTrans(){showTrans=!showTrans;render();}

var state={screen:"home",mode:"normal",questions:[],cur:0,sel:null,answered:false,score:0,results:[],selCat:"all",rem:[],totalDone:0,totalCorrect:0,round:1};

function shuffle(a){return a.slice().sort(function(){return Math.random()-.5})}

// Persistent mastery tracking (per question: seen/correct counts)
// ===== Profiles / local accounts =====
// All data lives in the browser under one key. Each profile has its own
// mastery map and attempt history. No server, no passwords — local only.
var PKEY='ebt_profiles_v1';
var pdata={profiles:{},current:null};
var accountDraft='';        // holds the new-account name while typing
var showAccounts=false;     // account panel open/closed

function loadProfiles(){
  try{ var raw=localStorage.getItem(PKEY); if(raw)pdata=JSON.parse(raw); }catch(e){}
  if(!pdata||typeof pdata!=='object')pdata={profiles:{},current:null};
  if(!pdata.profiles)pdata.profiles={};
  // First run: migrate any older single-profile mastery data
  if(Object.keys(pdata.profiles).length===0){
    var old={};
    try{ var om=localStorage.getItem('ebt_mastery_v1'); if(om)old=JSON.parse(om)||{}; }catch(e){}
    var id='p'+Date.now();
    pdata.profiles[id]={name:'Standard',created:Date.now(),mastery:old,attempts:[]};
    pdata.current=id;
    saveProfiles();
  }
  if(!pdata.current||!pdata.profiles[pdata.current]){
    pdata.current=Object.keys(pdata.profiles)[0];
  }
}
function saveProfiles(){ try{ localStorage.setItem(PKEY,JSON.stringify(pdata)); }catch(e){} }
function currentProfile(){ return pdata.profiles[pdata.current]||{name:'—',mastery:{},attempts:[]}; }
function profileList(){
  return Object.keys(pdata.profiles).map(function(id){
    return {id:id,name:pdata.profiles[id].name};
  });
}
function createProfile(name){
  name=(name||'').trim()||('Konto '+(Object.keys(pdata.profiles).length+1));
  var id='p'+Date.now();
  pdata.profiles[id]={name:name,created:Date.now(),mastery:{},attempts:[]};
  pdata.current=id;
  accountDraft='';showAccounts=false;
  saveProfiles();
}
function switchProfile(id){
  if(pdata.profiles[id]){pdata.current=id;showAccounts=false;saveProfiles();render();}
}
function deleteProfile(id){
  if(Object.keys(pdata.profiles).length<=1)return; // keep at least one
  delete pdata.profiles[id];
  if(pdata.current===id)pdata.current=Object.keys(pdata.profiles)[0];
  saveProfiles();render();
}

// ===== Mastery (scoped to the current profile) =====
function mastery(){ return currentProfile().mastery; }
function recordAnswer(id,ok){
  var m=mastery();
  if(!m[id])m[id]={s:0,c:0};
  m[id].s++; if(ok)m[id].c++;
  saveProfiles();
}
function masteryStats(){
  var m=mastery(),seen=0,mastered=0;
  Q.forEach(function(q){
    var e=m[q.id];
    if(e&&e.s>0){seen++; if(e.c/e.s>=0.66)mastered++;}
  });
  return {seen:seen,mastered:mastered,total:Q.length};
}
function resetMastery(){ currentProfile().mastery={}; saveProfiles(); render(); }

// ===== Attempt history =====
function recordAttempt(){
  if(state.recorded)return;
  state.recorded=true;
  var sn,tot,pct,passed;
  if(state.mode==='infinite'){
    sn=state.totalCorrect;tot=state.totalDone;pct=Math.round(sn/Math.max(tot,1)*100);passed=true;
  } else {
    sn=state.score;tot=state.questions.length;pct=Math.round(sn/Math.max(tot,1)*100);
    passed=state.mode==='sim'?state.score>=17:pct>=70;
  }
  var p=currentProfile();
  if(!p.attempts)p.attempts=[];
  p.attempts.unshift({mode:state.mode,cat:state.selCat,score:sn,total:tot,pct:pct,passed:passed,date:Date.now(),timedOut:(state.mode==='sim'&&state.timeLeft===0)});
  if(p.attempts.length>100)p.attempts=p.attempts.slice(0,100);
  saveProfiles();
}
function completeQuiz(){ state.screen='result'; recordAttempt(); render(); }

function weakQuestions(){
  var m=mastery();
  return Q.filter(function(q){
    var e=m[q.id];
    return e&&e.s>0&&e.c/e.s<0.66;
  }).sort(function(a,b){
    var ea=m[a.id],eb=m[b.id];
    return (ea.c/ea.s)-(eb.c/eb.s);
  });
}

function startQuiz(cat,mode){
  mode=mode||'normal';
  var pool;
  if(cat==='weak'){
    pool=weakQuestions();
    if(pool.length===0){ state={screen:'home'}; render(); return; }
  } else {
    pool=cat==='all'?Q:Q.filter(function(q){return q.cat===cat});
  }
  if(mode==='infinite'){
    var rem=shuffle(pool);
    state={screen:'quiz',mode:'infinite',questions:[rem[0]],cur:0,sel:null,answered:false,score:0,results:[],selCat:cat,rem:rem.slice(1),totalDone:0,totalCorrect:0,round:1};
  } else {
    var qs=(cat==='weak'?pool:shuffle(pool)).slice(0,Math.min(33,pool.length));
    state={screen:'quiz',mode:mode,questions:qs,cur:0,sel:null,answered:false,score:0,results:[],selCat:cat,rem:[],totalDone:0,totalCorrect:0,round:1};
  }
  // Timer for simulation mode (60 min like the real test)
  stopTimer();
  if(mode==='sim'){
    state.timeLeft=60*60;
    timerInterval=setInterval(tick,1000);
  }
  render();
}

var timerInterval=null;
function stopTimer(){ if(timerInterval){clearInterval(timerInterval);timerInterval=null;} }
function tick(){
  if(state.mode!=='sim'||state.screen!=='quiz'){stopTimer();return;}
  state.timeLeft--;
  if(state.timeLeft<=0){
    state.timeLeft=0;stopTimer();
    completeQuiz();return;
  }
  // Only update the timer display, not full re-render (avoids losing selection)
  var el=document.getElementById('timer');
  if(el)el.textContent=fmtTime(state.timeLeft);
  else render();
}
function fmtTime(s){
  var m=Math.floor(s/60),ss=s%60;
  return m+':'+(ss<10?'0':'')+ss;
}

function answer(i){
  if(state.answered)return;
  var q=state.questions[state.cur];
  var ok=i===q.a;
  state.sel=i;state.answered=true;
  if(ok)state.score++;
  recordAnswer(q.id,ok);
  if(state.mode==='infinite'){
    state.totalDone++;
    if(ok)state.totalCorrect++;
    else state.rem.push(q);
  }
  state.results.push({q:q,sel:i,ok:ok});
  render();
}

function next(){
  if(state.mode==='infinite'){
    if(state.rem.length===0){
      var wrong=state.results.filter(function(r){return!r.ok}).map(function(r){return r.q;});
      if(wrong.length===0){completeQuiz();return;}
      state.round++;
      var nq=shuffle(wrong);
      state.questions=[nq[0]];state.rem=nq.slice(1);
      state.cur=0;state.sel=null;state.answered=false;state.score=0;state.results=[];
      render();return;
    }
    var nextQ=state.rem[0];state.rem=state.rem.slice(1);
    state.questions=[nextQ];state.cur=0;state.sel=null;state.answered=false;
    render();return;
  }
  if(state.cur+1>=state.questions.length){stopTimer();completeQuiz();return;}
  state.cur++;state.sel=null;state.answered=false;render();
}

function home(){stopTimer();state.screen='home';render();}


function render(){
  var app=document.getElementById('app');
  if(state.screen==='home')app.innerHTML=renderHome();
  else if(state.screen==='quiz')app.innerHTML=renderQuiz();
  else app.innerHTML=renderResult();
  window.scrollTo(0,0);
}

function h(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function renderToggle(){
  return '<div class="lang-row">'+
    '<span style="color:'+(showTrans?'var(--muted-2)':'var(--ink)')+'">DE</span>'+
    '<label class="tog-wrap">'+
    '<input type="checkbox" '+(showTrans?'checked':'')+' onchange="toggleTrans()" aria-label="Englische Übersetzung anzeigen">'+
    '<div class="tog-track"></div><div class="tog-thumb"></div>'+
    '</label>'+
    '<span style="color:'+(showTrans?'var(--gold-deep)':'var(--muted-2)')+'">EN</span>'+
  '</div>';
}

function renderAccountBar(){
  var cur=currentProfile();
  var list=profileList();
  var panel='';
  if(showAccounts){
    var rows=list.map(function(p){
      var active=p.id===pdata.current;
      var del=list.length>1?'<button class="acct-del" onclick="event.stopPropagation();deleteProfile(\''+p.id+'\')" aria-label="Konto löschen">✕</button>':'';
      return '<div class="acct-row'+(active?' active':'')+'" onclick="switchProfile(\''+p.id+'\')">'+
        '<span class="acct-dot">'+(active?'●':'○')+'</span><span class="acct-name">'+h(p.name)+'</span>'+del+'</div>';
    }).join('');
    panel='<div class="acct-panel">'+rows+
      '<div class="acct-new"><input class="acct-input" type="text" placeholder="Neues Konto…" value="'+h(accountDraft)+'" oninput="setDraft(this.value)" onkeydown="if(event.key===\'Enter\')submitAccount()" maxlength="24">'+
      '<button class="acct-add" onclick="submitAccount()">＋</button></div></div>';
  }
  return '<div class="acct-corner">'+
    '<button class="acct-pill'+(showAccounts?' open':'')+'" onclick="toggleAccounts()" aria-expanded="'+showAccounts+'">'+
      '<span class="acct-ico">👤</span><span class="acct-cur-name">'+h(cur.name)+'</span>'+
      '<span class="acct-caret">'+(showAccounts?'▲':'▼')+'</span></button>'+
    panel+'</div>';
}

function modeLabel(m){ return m==='sim'?'Simulation':m==='infinite'?'Endlos':m==='weak'?'Schwache':'Übung'; }
function catLabel(c){ return c==='all'?'Alle Themen':c==='weak'?'Schwache Fragen':c; }
function fmtDate(ts){
  var d=new Date(ts),now=new Date();
  var day=d.getDate()+'.'+(d.getMonth()+1)+'.';
  var hh=d.getHours(),mm=d.getMinutes();
  var time=hh+':'+(mm<10?'0':'')+mm;
  var isToday=d.toDateString()===now.toDateString();
  return isToday?('Heute '+time):(day+' '+time);
}
function renderHistory(){
  var att=currentProfile().attempts||[];
  if(att.length===0)return '';
  var rows=att.slice(0,8).map(function(a){
    var dot=a.passed?'<span class="hist-dot pass"></span>':'<span class="hist-dot fail"></span>';
    var badge=a.mode==='sim'?(a.passed?'Bestanden':'Nicht bestanden'):a.pct+'%';
    return '<div class="hist-row">'+dot+
      '<span class="hist-mode">'+modeLabel(a.mode)+'</span>'+
      '<span class="hist-cat">'+h(catLabel(a.cat))+'</span>'+
      '<span class="hist-score">'+a.score+'/'+a.total+'</span>'+
      '<span class="hist-date">'+fmtDate(a.date)+'</span></div>';
  }).join('');
  return '<div class="sec-label" style="margin-top:2rem">Verlauf</div><div class="hist">'+rows+'</div>';
}

function renderHome(){
  var cats=CATS.map(function(c){
    var n=Q.filter(function(q){return q.cat===c}).length;
    return '<button class="cat-btn" onclick="startQuiz(\''+h(c)+'\',\'normal\')"><span class="cn">'+h(c)+'</span><span class="cc">'+n+' Fragen</span></button>';
  }).join('');
  var ms=masteryStats();
  var progHtml='';
  if(ms.seen>0){
    var mpct=Math.round(ms.mastered/ms.total*100);
    progHtml='<div class="progress-panel"><div class="progress-head"><span class="progress-label">Ihr Fortschritt</span>'+
      '<button class="reset-link" onclick="resetMastery()">zurücksetzen</button></div>'+
      '<div class="progress-bar"><div class="progress-fill" style="width:'+mpct+'%"></div></div>'+
      '<div class="progress-stats"><span><b>'+ms.mastered+'</b> von '+ms.total+' gemeistert</span><span>'+ms.seen+' gesehen</span></div></div>';
  }
  var weak=weakQuestions();
  var weakBtn=weak.length>0?
    '<button class="mode-btn weak" onclick="startQuiz(\'weak\',\'normal\')"><span class="idx">★</span><span class="body"><span class="t">Schwache Fragen</span><span class="d">'+weak.length+' Frage'+(weak.length===1?'':'n')+', die Sie öfter falsch hatten</span></span><span class="arr">→</span></button>':'';
  return '<div class="fade">'+renderAccountBar()+renderToggle()+
    '<div class="intro"><p>Üben Sie alle 300 offiziellen Fragen des Einbürgerungstests. Der echte Test umfasst 33 Fragen — mindestens 17 richtige Antworten bestehen.</p>'+
    '<div class="lead"><span><b>33</b> Fragen</span><span><b>17</b> zum Bestehen</span><span><b>60</b> Minuten</span></div></div>'+
    progHtml+
    '<div class="modes">'+
    '<button class="mode-btn primary" onclick="startQuiz(\'all\',\'normal\')"><span class="idx">1</span><span class="body"><span class="t">Übungstest</span><span class="d">33 zufällige Fragen aus allen Themen</span></span><span class="arr">→</span></button>'+
    '<button class="mode-btn sim" onclick="startQuiz(\'all\',\'sim\')"><span class="idx">2</span><span class="body"><span class="t">Prüfungssimulation</span><span class="d">33 Fragen mit Bestanden-Bewertung</span></span><span class="arr">→</span></button>'+
    '<button class="mode-btn inf" onclick="startQuiz(\'all\',\'infinite\')"><span class="idx">∞</span><span class="body"><span class="t">Endlos-Modus</span><span class="d">Alle 300 Fragen, falsche werden wiederholt</span></span><span class="arr">→</span></button>'+
    weakBtn+
    '</div>'+
    '<div class="sec-label">Nach Thema üben</div>'+cats+
    renderHistory()+'</div>';
}

function renderQuiz(){
  var q=state.questions[state.cur];
  var tr=TRANS[q.id]||{qt:'',ot:['','','','']};
  var progHtml='';
  if(state.mode==='infinite'){
    progHtml='<div class="inf-stats">'+
      '<div class="stat-box"><div class="stat-num g">'+state.round+'</div><div class="stat-lbl">Runde</div></div>'+
      '<div class="stat-box"><div class="stat-num gr">'+state.totalCorrect+'</div><div class="stat-lbl">Richtig</div></div>'+
      '<div class="stat-box"><div class="stat-num">'+(state.rem.length+1)+'</div><div class="stat-lbl">Übrig</div></div>'+
    '</div>';
  } else {
    var pct=Math.round((state.cur+(state.answered?1:0))/state.questions.length*100);
    progHtml='<div class="pinfo"><span>'+(state.selCat==='all'?'Alle Themen':h(state.selCat))+'</span><span><b>'+(state.cur+1)+'</b> / '+state.questions.length+' · ✓ '+state.score+'</span></div>'+
      '<div class="pbar"><div class="pfill" style="width:'+pct+'%"></div></div>';
  }
  var badge=state.mode==='sim'?'<div class="badge sim">Prüfungssimulation · <span id="timer" class="'+((state.timeLeft||3600)<=300?'time-low':'')+'">'+fmtTime(state.timeLeft||3600)+'</span></div>':
            state.mode==='infinite'?'<div class="badge inf">∞ Endlos-Modus</div>':
            state.selCat==='weak'?'<div class="badge weak-badge">★ Schwache Fragen</div>':'';
  var opts=q.o.map(function(opt,i){
    var cls='opt';
    if(state.answered){if(i===q.a)cls+=' correct';else if(i===state.sel)cls+=' wrong';}
    var enSpan=showTrans?'<span class="opt-en">'+h(tr.ot[i]||'')+'</span>':'';
    return '<button class="'+cls+'"'+(state.answered?' disabled':'')+' onclick="answer('+i+')">'+
      '<span class="opt-letter">'+String.fromCharCode(65+i)+'</span>'+
      '<span><span>'+h(opt)+'</span>'+enSpan+'</span></button>';
  }).join('');
  var fb='';
  if(state.answered){
    var ok=state.sel===q.a;
    var nl=state.mode==='infinite'?(state.rem.length===0?'Runde abschließen →':'Nächste Frage →'):(state.cur+1>=state.questions.length?'Ergebnis anzeigen →':'Nächste Frage →');
    fb='<div class="feedback '+(ok?'ok':'fail')+'">'+(ok?'✓ Richtig':'✗ Falsch — richtig ist: '+h(q.o[q.a]))+'</div>'+
       '<button class="act-btn" onclick="next()">'+nl+'</button>';
  }
  var hint=state.answered?'':'<div class="kbd-hint">Tipp: Tasten <kbd>A</kbd>–<kbd>D</kbd> oder <kbd>1</kbd>–<kbd>4</kbd> zum Antworten</div>';
  return '<div class="fade">'+renderToggle()+badge+progHtml+
    '<div class="cat-tag">Frage '+q.id+' · '+h(q.cat)+'</div>'+
    '<div class="q-card"><p class="q-text">'+h(q.q)+'</p>'+(showTrans&&tr.qt?'<p class="q-trans">'+h(tr.qt)+'</p>':'')+
    '</div><div>'+opts+'</div>'+fb+hint+'</div>';
}

function renderResult(){
  var pct=state.mode==='infinite'?Math.round(state.totalCorrect/Math.max(state.totalDone,1)*100):Math.round(state.score/state.questions.length*100);
  var sn=state.mode==='infinite'?state.totalCorrect:state.score;
  var tot=state.mode==='infinite'?state.totalDone:state.questions.length;
  var passed=state.mode==='sim'?state.score>=17:pct>=70;
  var cls=passed?'pass':'fail';
  var verdict;
  if(state.mode==='infinite'){
    verdict='<div class="verdict" style="color:var(--green)">Alle Fragen gemeistert</div><div class="verdict-note">Abgeschlossen in '+state.round+' Runde(n)</div>';
  } else if(state.mode==='sim'){
    var timedOut=state.timeLeft===0;
    var note=timedOut?'Zeit abgelaufen — '+(state.score>=17?'trotzdem bestanden!':'mind. 17 von 33 nötig'):(state.score>=17?'Sie haben die Bestehensgrenze erreicht':'Mindestens 17 von 33 nötig');
    verdict='<div class="verdict" style="color:'+(state.score>=17?'var(--green)':'var(--red)')+'">'+(state.score>=17?'Bestanden':'Nicht bestanden')+'</div><div class="verdict-note">'+note+'</div>';
  } else {
    verdict='<div class="verdict" style="color:'+(pct>=70?'var(--green)':pct>=50?'var(--gold-deep)':'var(--red)')+'">'+(pct>=70?'Ausgezeichnet':pct>=50?'Gut gemacht':'Weiter üben')+'</div>';
  }
  var missed=state.results.filter(function(r){return!r.ok;});
  var mHtml=missed.length?'<div class="sec-label">Zum Wiederholen</div>'+
    missed.map(function(r){
      var tr=TRANS[r.q.id]||{qt:'',ot:['','','','']};
      return '<div class="missed-item"><div class="missed-meta">Frage '+r.q.id+' · '+h(r.q.cat)+'</div>'+
        '<div class="missed-q">'+h(r.q.q)+'</div>'+
        (showTrans&&tr.qt?'<div class="missed-q-en">'+h(tr.qt)+'</div>':'')+
        '<div class="missed-a">✓ '+h(r.q.o[r.q.a])+'</div>'+
        (showTrans&&tr.ot[r.q.a]?'<div class="missed-a-en">'+h(tr.ot[r.q.a])+'</div>':'')+
      '</div>';
    }).join(''):'';
  var cat=h(state.selCat).replace(/'/g,"\\'");
  var retryBtn=state.mode==='infinite'?
    '<button class="act-btn" onclick="startQuiz(\'' + cat + '\',\'infinite\')">Nochmal starten</button>':
    '<button class="act-btn" onclick="startQuiz(\'' + cat + '\',\'' + state.mode + '\')">Nochmal versuchen</button>';
  var badge=state.mode==='sim'?'<div class="badge sim">Prüfungssimulation</div>':
            state.mode==='infinite'?'<div class="badge inf">∞ Endlos-Modus</div>':'';
  return '<div class="fade">'+renderToggle()+badge+
    '<div class="result-card"><div class="lbl">Ihr Ergebnis</div>'+
    '<div class="big-score '+cls+'">'+sn+'</div>'+
    '<div class="score-sub">von '+tot+' Fragen richtig · '+pct+'%</div>'+
    verdict+'</div>'+mHtml+
    '<div style="margin-top:1.25rem">'+retryBtn+
    '<button class="act-btn ghost" onclick="home()">← Zurück zum Start</button></div></div>';
}

window.startQuiz=startQuiz;window.answer=answer;window.next=next;window.home=home;window.toggleTrans=toggleTrans;window.resetMastery=resetMastery;
window.switchProfile=switchProfile;window.deleteProfile=deleteProfile;window.createProfile=createProfile;
window.toggleAccounts=toggleAccounts;window.submitAccount=submitAccount;window.setDraft=setDraft;

function toggleAccounts(){ showAccounts=!showAccounts; render(); }
function setDraft(v){ accountDraft=v; }
function submitAccount(){ createProfile(accountDraft); render(); }

// Keyboard shortcuts
document.addEventListener('keydown',function(e){
  if(state.screen!=='quiz')return;
  var q=state.questions[state.cur];
  if(!state.answered){
    // A-D or 1-4 to answer
    var k=e.key.toLowerCase();
    var idx=-1;
    if(k>='1'&&k<='4')idx=parseInt(k)-1;
    else if(k>='a'&&k<='d')idx=k.charCodeAt(0)-97;
    if(idx>=0&&idx<q.o.length){e.preventDefault();answer(idx);}
  } else {
    // Enter or Space to advance
    if(e.key==='Enter'||e.key===' '){e.preventDefault();next();}
  }
});

loadProfiles();
render();

</script>
</body>
</html>
